<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --ink:#0B1220;
    --panel:#131B2C;
    --panel-2:#1B2740;
    --line:#2A3550;
    --paper:#F2EFE7;
    --muted:#8B96AC;
    --fuel:#FF8A3D;
    --volt:#C8FF4D;
    --teal:#46E1C4;
    --ember:#FF5D5D;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
html{background:var(--ink);}
body{font-family:var(--font-body);background:var(--ink);color:var(--paper);min-height:100vh;}

.auth-screen{display:none;position:fixed;inset:0;background:var(--ink);z-index:1000;overflow-y:auto;align-items:center;justify-content:center;}
.auth-screen.active{display:flex;}
.auth-container{width:100%;max-width:400px;padding:40px 20px;}
.auth-title{font-family:var(--font-display);font-size:32px;font-weight:700;margin-bottom:30px;text-align:center;}
.auth-form{display:flex;flex-direction:column;gap:12px;}
.auth-input{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--paper);font-size:15px;}
.auth-input:focus{outline:none;border-color:var(--fuel);}
.auth-btn{padding:14px;border-radius:10px;border:none;background:var(--fuel);color:#1A0F03;font-weight:600;cursor:pointer;margin-top:8px;}
.auth-toggle{text-align:center;margin-top:16px;color:var(--muted);font-size:14px;}
.auth-toggle a{color:var(--fuel);cursor:pointer;text-decoration:underline;}

.app-screen{display:none;}
.app-screen.active{display:block;}

.topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg, var(--panel) 0%, var(--ink) 100%);}
.topbar-inner{max-width:720px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{font-size:26px;filter:drop-shadow(0 0 8px rgba(255,138,61,.5));}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:1px;}
.user-menu{display:flex;align-items:center;gap:12px;}
.user-badge{font-family:var(--font-mono);font-size:11px;background:var(--volt);color:#1A0F03;padding:4px 10px;border-radius:999px;font-weight:600;}
.logout-btn{padding:6px 12px;background:var(--ember);color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;}

.container{max-width:720px;margin:0 auto;padding:20px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.5px;margin-bottom:14px;color:var(--paper);}

.gauge-section{text-align:center;}
.gauge-wrap{position:relative;width:220px;height:220px;margin:0 auto;}
.gauge-svg{width:100%;height:100%;}
.gauge-track{fill:none;stroke:var(--panel-2);stroke-width:10;}
.gauge-fill{fill:none;stroke:var(--fuel);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dashoffset .6s ease;}
.tick{stroke:var(--line);stroke-width:2;}
.tick.major{stroke:var(--muted);stroke-width:2.5;}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-value{font-family:var(--font-mono);font-weight:600;font-size:42px;line-height:1;color:var(--paper);}
.gauge-unit{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:6px;}

.macro-row{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;margin-bottom:18px;}
.tube{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:16px 12px;text-align:center;}
.tube-label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;}
.tube-value{font-family:var(--font-mono);font-weight:600;font-size:26px;color:var(--accent);}
.tube-value small{font-size:14px;font-weight:400;margin-left:2px;color:var(--muted);}

.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.input-row{display:flex;gap:8px;}
.input-row input{margin:0;}
.input-row button{margin:0;width:auto;padding:0 18px;}

input, select, textarea{width:100%;padding:13px 14px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--paper);font-family:var(--font-body);font-size:15px;}
input::placeholder, textarea::placeholder{color:var(--muted);}
input:focus, select:focus, textarea:focus{outline:none;border-color:var(--fuel);}

button{width:100%;padding:13px;margin-top:8px;background:var(--fuel);color:#1A0F03;border:none;border-radius:10px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;}
button:hover{opacity:.9;}
button:disabled{opacity:.5;cursor:not-allowed;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}
.chip{width:auto;flex:1 1 auto;padding:10px 14px;margin:0;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;cursor:pointer;}
.chip:hover{color:var(--paper);}
.chip.active{background:var(--fuel);border-color:var(--fuel);color:#1A0F03;font-weight:600;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;margin-top:6px;}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;}
td:nth-child(2), td:nth-child(3), td:nth-child(4), td:nth-child(5), td:nth-child(6){font-family:var(--font-mono);color:var(--paper);}
tr:hover td{background:var(--panel-2);}
.delete-btn{background:transparent;border:1px solid var(--ember);color:var(--ember);padding:6px 10px;border-radius:8px;cursor:pointer;width:auto;margin-top:0;font-size:13px;}
.delete-btn:hover{background:var(--ember);color:var(--ink);}
.empty-row td{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px;padding:24px 12px;}

canvas{margin-top:6px;max-height:260px;}

.ai-tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-bottom:12px;}
.ai-response{margin-top:14px;padding:14px 16px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--volt);border-radius:10px;font-size:14px;line-height:1.6;color:var(--paper);white-space:pre-wrap;display:none;}
.ai-response.visible{display:block;}
.ai-response.loading{color:var(--muted);font-family:var(--font-mono);}

.statusbar{max-width:720px;margin:0 auto;padding:18px 20px 40px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--muted);}

@media(max-width:640px){
    .split{grid-template-columns:1fr;}
    .macro-row{grid-template-columns:1fr;}
}
</style>
</head>

</div>

<!-- APP SCREEN -->

</header>

<main class="container">

            </svg>
            <div class="gauge-center">

                <span class="gauge-unit">KCAL</span>
            </div>
        </div>
    </section>

    <section class="macro-row">
        <div class="tube" style="--accent:var(--volt)">
            <span class="tube-label">PROTEIN</span>
            <span class="tube-value" id="protein">0<small>g</small></span>
        </div>
        <div class="tube" style="--accent:var(--teal)">
            <span class="tube-label">CARBS</span>
            <span class="tube-value" id="carbs">0<small>g</small></span>
        </div>
        <div class="tube" style="--accent:var(--ember)">
            <span class="tube-label">FAT</span>
            <span class="tube-value" id="fat">0<small>g</small></span>
        </div>
    </section>

    <section class="panel">
        <span class="ai-tag">🤖 AI · NUTRITION COACH</span>
        <h2 class="panel-title">Ask Fuel AI</h2>
        <textarea id="aiQuestion" placeholder="Ask nutrition questions..."></textarea>
        <button id="aiAskBtn" onclick="askAI()">Ask AI Coach</button>
        <div class="ai-response" id="aiResponse"></div>
    </section>

    <section class="panel">
        <h2 class="panel-title">ADD FOOD (200+ Foods)</h2>
        <input id="search" placeholder="Search: chicken, rice, dal...">
        <select id="foodSelect"></select>
        <input id="quantity" type="number" placeholder="Quantity">
        <small id="unitHint"></small>
        <div class="chip-row" id="mealChips">
            <button type="button" class="chip active" data-meal="Breakfast">Breakfast</button>
            <button type="button" class="chip" data-meal="Lunch">Lunch</button>
            <button type="button" class="chip" data-meal="Dinner">Dinner</button>
            <button type="button" class="chip" data-meal="Snacks">Snacks</button>
        </div>
        <button onclick="addFood()">➕ Add Food</button>
    </section>

    <section class="panel">
        <h2 class="panel-title">TODAY'S LOG</h2>
        <div class="table-wrap">
            <table>
                <thead>

                    <th>Carbs</th>
                    <th>Fat</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="foodTable"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2 class="panel-title">WEEKLY ENERGY</h2>
        <canvas id="chart"></canvas>
    </section>

</main>

<footer class="statusbar">
    FUEL · Premium Nutrition Tracker
</footer>

</div>

let currentUser = null, data = {}, selectedMeal = "Breakfast";

auth.onAuthStateChanged(async (user) => {
    if (user) {
        currentUser = user;
        await grantFreeTrialIfNew();
        initApp();
    } else {
        showAuthScreen();
    }
});

function toggleAuthMode() {
    document.getElementById("loginForm").style.display = document.getElementById("loginForm").style.display === "none" ? "block" : "none";
    document.getElementById("signupForm").style.display = document.getElementById("signupForm").style.display === "none" ? "block" : "none";
}

async function handleSignup() {
    const email = document.getElementById("signupEmail").value;
    const pwd = document.getElementById("signupPassword").value;
    const conf = document.getElementById("signupConfirm").value;
    if (!email || pwd.length < 6 || pwd !== conf) {
        document.getElementById("signupError").textContent = "Check your details";
        document.getElementById("signupError").style.display = "block";
        return;
    }
    try {
        await auth.createUserWithEmailAndPassword(email, pwd);
    } catch (e) {
        document.getElementById("signupError").textContent = e.message;
        document.getElementById("signupError").style.display = "block";
    }
}

async function handleLogin() {
    const email = document.getElementById("loginEmail").value;
    const pwd = document.getElementById("loginPassword").value;
    if (!email || !pwd) {
        document.getElementById("loginError").textContent = "Enter email & password";
        document.getElementById("loginError").style.display = "block";
        return;
    }
    try {
        await auth.signInWithEmailAndPassword(email, pwd);
    } catch (e) {
        document.getElementById("loginError").textContent = e.message;
        document.getElementById("loginError").style.display = "block";
    }
}

async function handleLogout() {
    await auth.signOut();
}

async function grantFreeTrialIfNew() {
    try {
        const doc = await db.collection("subscriptions").doc(currentUser.uid).get();
        if (!doc.exists) {
            await db.collection("subscriptions").doc(currentUser.uid).set({
                status: "active",
                trialEndsAt: new Date(Date.now() + 3 * 24 * 60 * 60 * 1000),
                createdAt: new Date()
            });
            console.log("✅ 3-day trial granted!");
        }
    } catch (e) {
        console.error("Trial error:", e);
    }
}

function showAuthScreen() {
    document.getElementById("authScreen").classList.add("active");
    document.getElementById("appScreen").classList.remove("active");
}

function initApp() {
    showAuthScreen();
    document.getElementById("authScreen").classList.remove("active");
    document.getElementById("appScreen").classList.add("active");
    
    const key = todayKey();
    data[key] = data[key] || {meals: []};
    
    initGaugeTicks();
    initFoodSelect();
    initMealChips();
    render();
}

function todayKey() {
    return new Date().toISOString().slice(0, 10);
}

function initGaugeTicks() {
    const group = document.getElementById("gaugeTicks");
    const cx = 110, cy = 110, outerR = 100, innerR = 94;
    for (let i = 0; i < 40; i++) {
        const angle = (i / 40) * 2 * Math.PI - Math.PI / 2;
        const isMajor = i % 5 === 0;
        const rInner = isMajor ? 90 : innerR;
        const x1 = cx + outerR * Math.cos(angle);
        const y1 = cy + outerR * Math.sin(angle);
        const x2 = cx + rInner * Math.cos(angle);
        const y2 = cy + rInner * Math.sin(angle);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1.toFixed(2));
        line.setAttribute("y1", y1.toFixed(2));
        line.setAttribute("x2", x2.toFixed(2));
        line.setAttribute("y2", y2.toFixed(2));
        line.setAttribute("class", isMajor ? "tick major" : "tick");
        group.appendChild(line);
    }
}

function initFoodSelect() {
    const searchInput = document.getElementById("search");
    const foodSelect = document.getElementById("foodSelect");
    const quantityInput = document.getElementById("quantity");
    const unitHint = document.getElementById("unitHint");

    function populateFoodSelect(filter = "") {
        const term = filter.trim().toLowerCase();
        const filtered = foods.filter(f => f.name.toLowerCase().includes(term));
        foodSelect.innerHTML = filtered.map(f => `<option value="${f.id}">${f.name} (${f.unit})</option>`).join("");
        updateUnitHint();
    }

    function updateUnitHint() {
        const id = parseInt(foodSelect.value, 10);
        const food = foods.find(f => f.id === id);
        unitHint.textContent = food ? `Quantity in "${food.unit}" — 1 serving = ${food.serving} ${food.unit}` : "";
    }

    searchInput.addEventListener("input", () => populateFoodSelect(searchInput.value));
    foodSelect.addEventListener("change", updateUnitHint);
    populateFoodSelect();
}

function initMealChips() {
    document.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
            document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            selectedMeal = chip.dataset.meal;
        });
    });
}

function addFood() {
    const foodSelect = document.getElementById("foodSelect");
    const quantityInput = document.getElementById("quantity");
    const id = parseInt(foodSelect.value, 10);
    const food = foods.find(f => f.id === id);
    const qty = parseFloat(quantityInput.value);

    if (!food || !qty || qty <= 0) {
        alert("Select food & enter quantity");
        return;
    }

    const ratio = qty / food.serving;
    const entry = {
        entryId: Date.now(),
        name: food.name,
        qty: qty + " " + food.unit,
        meal: selectedMeal,
        calories: Math.round(food.calories * ratio),
        protein: +(food.protein * ratio).toFixed(1),
        carbs: +(food.carbs * ratio).toFixed(1),
        fat: +(food.fat * ratio).toFixed(1)
    };

    const key = todayKey();
    data[key].meals.push(entry);
    quantityInput.value = "";
    render();
}

function deleteFood(entryId) {
    const key = todayKey();
    data[key].meals = data[key].meals.filter(m => m.entryId !== entryId);
    render();
}

function render() {
    const meals = data[todayKey()].meals;
    const tbody = document.getElementById("foodTable");
    
    if (meals.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No entries yet — log your first meal above.</td></tr>`;
    } else {
        tbody.innerHTML = meals.map(m => `
            <tr>
                <td>${m.name}</td>
                <td>${m.qty}</td>
                <td>${m.calories}</td>
                <td>${m.protein}g</td>
                <td>${m.carbs}g</td>
                <td>${m.fat}g</td>
                <td><button class="delete-btn" onclick="deleteFood(${m.entryId})">✕</button></td>
            </tr>`).join("");
    }

    const totals = meals.reduce((acc, m) => ({
        calories: acc.calories + m.calories,
        protein: acc.protein + m.protein,
        carbs: acc.carbs + m.carbs,
        fat: acc.fat + m.fat
    }), {calories: 0, protein: 0, carbs: 0, fat: 0});

    const GAUGE_R = 90;
    const GAUGE_CIRC = 2 * Math.PI * GAUGE_R;
    const gaugeFill = document.getElementById("gaugeFill");
    const goal = 2000;
    const percent = Math.max(0, Math.min(1, totals.calories / goal));
    const offset = GAUGE_CIRC * (1 - percent);
    gaugeFill.style.strokeDasharray = GAUGE_CIRC;
    gaugeFill.style.strokeDashoffset = offset;
    gaugeFill.style.stroke = totals.calories > goal ? "var(--ember)" : "var(--fuel)";

    document.getElementById("gaugeValue").textContent = Math.round(totals.calories);
    document.getElementById("protein").innerHTML = `${totals.protein.toFixed(1)}<small>g</small>`;
    document.getElementById("carbs").innerHTML = `${totals.carbs.toFixed(1)}<small>g</small>`;
    document.getElementById("fat").innerHTML = `${totals.fat.toFixed(1)}<small>g</small>`;

    renderChart();
}

let chartInstance = null;

function renderChart() {
    const labels = [];
    const values = [];

    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const dayData = data[key];
        const total = dayData ? dayData.meals.reduce((sum, m) => sum + m.calories, 0) : 0;
        labels.push(d.toLocaleDateString(undefined, {weekday: "short"}));
        values.push(total);
    }

    const ctx = document.getElementById("chart");

    if (chartInstance) {
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = values;
        chartInstance.update();
        return;
    }

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {labels, datasets: [{label: "Calories", data: values, backgroundColor: "#FF8A3D", borderRadius: 6}]},
        options: {
            responsive: true,
            plugins: {legend: {display: false}},
            scales: {y: {beginAtZero: true, ticks: {color: "#8B96AC"}, grid: {color: "#2A3550"}}, x: {ticks: {color: "#8B96AC"}, grid: {color: "#2A3550"}}}
        }
    });
}

async function askAI() {
    const input = document.getElementById("aiQuestion");
    const btn = document.getElementById("aiAskBtn");
    const box = document.getElementById("aiResponse");
    const question = input.value.trim();

    if (!question) {
        alert("Ask a question");
        return;
    }

    btn.disabled = true;
    box.textContent = "🤖 AI Coach is thinking...";
    box.classList.add("visible", "loading");

    try {
        const response = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({mode: "chat", message: question})
        });

        const json = await response.json();
        box.textContent = json.reply || "No response";
        box.classList.remove("loading");
        input.value = "";
    } catch (err) {
        box.textContent = "AI Coach unavailable. Set up Groq API for this feature.";
        box.classList.remove("loading");
    } finally {
        btn.disabled = false;
    }
}
